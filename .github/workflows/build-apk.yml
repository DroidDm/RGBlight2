name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Build signed release APK'
        type: boolean
        default: false
      create_update_json:
        description: 'Create update.json and attach to GitHub Release'
        type: boolean
        default: false
      changelog:
        description: 'Changelog for update.json'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Decode keystore (if signed)
        if: ${{ inputs.signed }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          test -s "$GITHUB_WORKSPACE/release.jks"
      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.signed }}" = "true" ]; then
            gradle assembleRelease
          else
            gradle assembleDebug
          fi
      - name: Extract version from gradle
        id: ver
        run: |
          if [ -f app/build.gradle.kts ]; then GRADLE=app/build.gradle.kts
          elif [ -f app/build.gradle ]; then GRADLE=app/build.gradle
          else echo "::error::app/build.gradle(.kts) not found"; exit 1; fi
          VC=$(grep -oP 'versionCode\s*=\s*\K\d+' "$GRADLE" | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GRADLE" | head -1)
          if [ -z "$VC" ]; then echo "::error::Cannot parse versionCode"; exit 1; fi
          if [ -z "$VN" ]; then VN="$VC"; fi
          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "name=$VN" >> $GITHUB_OUTPUT
      - name: Collect APK and compute SHA-256
        id: apk
        run: |
          if [ "${{ inputs.signed }}" = "true" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
            OUT=app-release.apk
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
            OUT=app-debug.apk
          fi
          if [ ! -f "$APK" ]; then echo "::error::APK not found: $APK"; exit 1; fi
          mkdir -p output
          cp "$APK" "output/$OUT"
          SHA=$(sha256sum "output/$OUT" | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "filename=$OUT" >> $GITHUB_OUTPUT
      - name: Create update.json
        if: ${{ inputs.create_update_json }}
        env:
          VC: ${{ steps.ver.outputs.code }}
          VN: ${{ steps.ver.outputs.name }}
          SHA: ${{ steps.apk.outputs.sha }}
          FN: ${{ steps.apk.outputs.filename }}
          REPO: ${{ github.repository }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          APK_URL="https://github.com/${REPO}/releases/download/v${VC}/${FN}"
          jq -n \
            --argjson vc "$VC" \
            --arg vn "$VN" \
            --arg sha "$SHA" \
            --arg url "$APK_URL" \
            --arg cl "$CHANGELOG" \
            '{versionCode: $vc, versionName: $vn, apkUrl: $url, sha256: $sha, changelog: $cl}' \
            > output/update.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: output/
      - name: Create GitHub Release
        if: ${{ inputs.create_update_json }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: v${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})
          body: ${{ inputs.changelog }}
          files: |
            output/${{ steps.apk.outputs.filename }}
            output/update.json